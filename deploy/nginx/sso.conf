# SSO 认证中心站点（基础设施独立入口，不经业务网关）
# 约定：仓库归档于 deploy/nginx/sso.conf，服务器上位于 /project/sso/nginx/sso.conf，
# 软链到 /etc/nginx/sites-enabled/sso（与 gateway 的站点同样的管理方式）。
# 对外端口 4000 → 容器上游 127.0.0.1:4400
# （服务端 .env 里 SSO_PORT=4400，把 4000 让给 nginx；compose 默认仍为 4000）。
server {
    listen 4000;
    listen [::]:4000;

    server_name 82.157.201.240;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;

        # 必须用 $http_host（保留 "主机:端口"）；
        # 用 $host 会丢掉 :4000，导致 discovery / 授权跳转地址缺少端口。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
