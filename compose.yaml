name: sso

services:
  sso:
    image: "${SSO_IMAGE:?SSO_IMAGE is required}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      OIDC_ISSUER: "${OIDC_ISSUER:?OIDC_ISSUER is required}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      OIDC_COOKIE_KEYS: "${OIDC_COOKIE_KEYS:?OIDC_COOKIE_KEYS is required}"
      LOGIN_UI_URL: "${LOGIN_UI_URL:?LOGIN_UI_URL is required}"
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required}"
      WEB_CLIENT_REDIRECT_URIS: "${WEB_CLIENT_REDIRECT_URIS:?WEB_CLIENT_REDIRECT_URIS is required}"
      API_RESOURCE: "${API_RESOURCE:-urn:sso:api}"
      JWKS_PATH: /app/secrets/jwks.json
      TRUST_PROXY: "${TRUST_PROXY:-1}"
    ports:
      - "${SSO_BIND_ADDRESS:-127.0.0.1}:${SSO_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${SECRETS_PATH:-./secrets}:/app/secrets"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '4000') + '/health/ready').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - sso

networks:
  sso:
    name: "${SSO_NETWORK:-sso}"
